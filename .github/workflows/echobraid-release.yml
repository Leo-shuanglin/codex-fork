name: echobraid-release
on:
  push:
    tags: ['echobraid-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. echobraid-v1)
        required: true
        default: echobraid-v1

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
          shared-key: ${{ matrix.target }}
      - name: Build codex (release)
        working-directory: codex-rs
        run: cargo build --release -p codex-cli --target ${{ matrix.target }} --bin codex
      - name: Stage artifact
        run: |
          mkdir -p artifacts
          cp codex-rs/target/${{ matrix.target }}/release/codex artifacts/codex-${{ matrix.target }}
          chmod +x artifacts/codex-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: codex-${{ matrix.target }}
          path: artifacts/codex-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: package-universal
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Lipo universal
        run: |
          mkdir -p out
          mv dl/codex-aarch64-apple-darwin/codex-aarch64-apple-darwin out/codex-aarch64-apple-darwin
          mv dl/codex-x86_64-apple-darwin/codex-x86_64-apple-darwin out/codex-x86_64-apple-darwin
          lipo -create out/codex-aarch64-apple-darwin out/codex-x86_64-apple-darwin -output out/codex-universal-apple-darwin
          chmod +x out/codex-*-apple-darwin
          (cd out && shasum -a 256 codex-* > SHA256SUMS)
          ls -lah out
          cat out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: codex-macos-universal-bundle
          path: out/
          if-no-files-found: error

  release:
    name: publish-release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codex-macos-universal-bundle
          path: release-assets
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            EchoBraid pinned codex build (commit 9257d8451c).

            Assets:
            - codex-aarch64-apple-darwin
            - codex-x86_64-apple-darwin
            - codex-universal-apple-darwin (lipo)
            - SHA256SUMS
          files: release-assets/*
          fail_on_unmatched_files: true
